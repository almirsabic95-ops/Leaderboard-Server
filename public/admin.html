<div class="card">
    <h2>🚀 Brzo dodavanje igre</h2>
    <input type="text" id="gameName" placeholder="Naziv igre">
    <input type="text" id="gameCategory" placeholder="Mapa (npr. sportske)">
    <textarea id="gameContent" placeholder="Zalijepi <iframe ...> kod ovdje" style="height:150px;"></textarea>
    <button onclick="posaljiIgru()">Objavi igru</button>
</div>

<script>
async function posaljiIgru() {
    const podaci = {
        naziv: document.getElementById('gameName').value,
        kategorija: document.getElementById('gameCategory').value,
        sadrzaj: document.getElementById('gameContent').value
    };

    const res = await fetch('/api/dodaj-igru', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(podaci)
    });
    const r = await res.json();
    alert(r.message);
}
</script>
