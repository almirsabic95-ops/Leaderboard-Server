<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rekvizit Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #020617; color: #f8fafc; overflow: hidden; height: 100vh; }
        .hidden { display: none; }
        #screen-arena { height: 100dvh; display: flex; flex-direction: column; }
        #chat-window { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex flex-col">

    <div id="screen-login" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950 p-4 text-white">
        <div class="bg-slate-900 p-8 rounded-3xl border border-slate-800 w-full max-w-sm space-y-4 shadow-2xl">
            <h1 class="text-3xl font-black text-center text-blue-500 italic uppercase">Arena</h1>
            <input type="text" id="log-user" placeholder="Nadimak" class="w-full p-4 rounded-xl bg-slate-800 outline-none text-base">
            <input type="password" id="log-pass" placeholder="Lozinka" class="w-full p-4 rounded-xl bg-slate-800 outline-none text-base">
            <div id="wrapper-secret" class="hidden">
                <p class="text-[10px] text-orange-400 mb-1 ml-2 uppercase font-bold italic">Novi račun? Smisli tajnu šifru:</p>
                <input type="text" id="log-secret" placeholder="Tajna šifra" class="w-full p-4 rounded-xl bg-slate-800 border border-orange-500/50 outline-none text-base">
            </div>
            <button id="btn-prijava" onclick="prijava()" class="w-full p-4 bg-blue-600 rounded-2xl font-bold hover:bg-blue-500 active:scale-95 transition-all">KRENI</button>
        </div>
    </div>

    <div id="screen-menu" class="hidden fixed inset-0 z-40 bg-slate-950 p-4 overflow-y-auto">
        <div class="max-w-6xl mx-auto space-y-6 pb-10">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-black italic">REKVIZIT <span class="text-blue-500 text-3xl">ARENA</span></h2>
                <button onclick="location.reload()" class="bg-red-500/10 text-red-500 px-4 py-2 rounded-lg text-xs border border-red-500/20">ODJAVA</button>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 bg-slate-900 p-6 rounded-3xl border border-slate-800">
                    <div class="flex gap-2 mb-4 overflow-x-auto no-scrollbar pb-2">
                        <button onclick="ucitajTablicu('dan')" class="filter-btn bg-slate-800 px-4 py-2 rounded-lg text-xs whitespace-nowrap">Danas</button>
                        <button onclick="ucitajTablicu('tjedan')" class="filter-btn bg-slate-800 px-4 py-2 rounded-lg text-xs whitespace-nowrap">Tjedan</button>
                        <button onclick="ucitajTablicu('all')" class="filter-btn bg-blue-600 font-bold px-4 py-2 rounded-lg text-xs whitespace-nowrap">Sve</button>
                    </div>
                    <table class="w-full text-left">
                        <tbody id="main-leaderboard-body"></tbody>
                    </table>
                </div>
                <div class="grid grid-cols-2 gap-2" id="kategorije-lista">
                    <button onclick="ulaziUSobu('kultura')" class="p-4 bg-slate-900 rounded-xl border border-slate-800 text-sm">🎨 Kultura</button>
                    <button onclick="ulaziUSobu('sport')" class="p-4 bg-slate-900 rounded-xl border border-slate-800 text-sm">⚽ Sport</button>
                    <button onclick="ulaziUSobu('znanost')" class="p-4 bg-slate-900 rounded-xl border border-slate-800 text-sm">🧪 Znanost</button>
                    <button onclick="ulaziUSobu('balkan')" class="col-span-2 p-4 bg-orange-500/10 border border-orange-500/30 text-orange-500 rounded-xl font-bold hidden" id="admin-btn">🔥 BALKAN EXPRESS</button>
                </div>
            </div>
        </div>
    </div>

    <div id="screen-arena" class="hidden">
        <header class="p-3 bg-slate-900 border-b border-slate-800 flex justify-between items-center">
            <button onclick="povratakUMenu()" class="text-[10px] bg-slate-800 px-3 py-2 rounded-lg uppercase">← Nazad</button>
            <div id="room-title" class="font-bold text-blue-500 uppercase text-xs"></div>
            <div id="user-display" class="text-emerald-400 font-mono text-[10px]"></div>
        </header>
        <div class="flex flex-1 overflow-hidden">
            <main id="chat-window" class="p-4"></main>
        </div>
        <footer class="p-3 bg-slate-900 border-t border-slate-800">
            <div class="flex gap-2 max-w-4xl mx-auto">
                <input type="text" id="ans-input" placeholder="Odgovor..." class="flex-1 p-4 rounded-xl bg-slate-800 border border-slate-700 outline-none text-base">
                <button onclick="posaljiOdgovor()" class="bg-blue-600 px-6 rounded-xl font-bold uppercase text-xs">Šalji</button>
            </div>
        </footer>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io(); let mojId = "";

        function prijava() {
            const data = {
                ime: document.getElementById('log-user').value.trim(),
                lozinka: document.getElementById('log-pass').value,
                tajnaSifra: document.getElementById('log-secret').value
            };
            if(!data.ime || !data.lozinka) return alert("Unesi podatke!");
            socket.emit('prijava', data);
        }

        socket.on('prikazi_registraciju', () => {
            document.getElementById('wrapper-secret').classList.remove('hidden');
            const b = document.getElementById('btn-prijava');
            b.innerText = "REGISTRIRAJ SE"; b.classList.replace('bg-blue-600', 'bg-orange-600');
        });

        socket.on('uspjesna_prijava', (d) => {
            mojId = d.ime;
            document.getElementById('screen-login').classList.add('hidden');
            document.getElementById('screen-menu').classList.remove('hidden');
            if(d.jeAdmin) document.getElementById('admin-btn').classList.remove('hidden');
            document.getElementById('user-display').innerText = mojId;
            setTimeout(() => ucitajTablicu('all'), 300);
        });

        function ucitajTablicu(period) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'font-bold'); btn.classList.add('bg-slate-800');
            });
            event.currentTarget.classList.add('bg-blue-600', 'font-bold');
            socket.emit('dohvati_glavnu_tablicu', period);
        }

        socket.on('odgovor_glavna_tablica', (lista) => {
            document.getElementById('main-leaderboard-body').innerHTML = lista.map((p, i) => `
                <tr class="border-b border-slate-800/50 ${p.ime === mojId ? 'bg-blue-600/10' : ''}">
                    <td class="p-3 text-slate-500 text-[10px]">${i+1}.</td>
                    <td class="p-3 text-sm font-bold ${p.ime === mojId ? 'text-blue-400' : ''}">${p.ime}</td>
                    <td class="p-3 text-right text-emerald-400 font-mono text-sm">${p.bodovi}</td>
                </tr>`).join('');
        });

        function ulaziUSobu(s) {
            document.getElementById('screen-menu').classList.add('hidden');
            document.getElementById('screen-arena').classList.remove('hidden');
            document.getElementById('room-title').innerText = s;
            socket.emit('join_room', s); document.getElementById('chat-window').innerHTML = '';
        }

        function povratakUMenu() {
            document.getElementById('screen-arena').classList.add('hidden');
            document.getElementById('screen-menu').classList.remove('hidden');
            ucitajTablicu('all');
        }

        function posaljiOdgovor() {
            const i = document.getElementById('ans-input');
            if(i.value.trim()) { socket.emit('slanje_odgovora', { tekst: i.value }); i.value = ''; i.focus(); }
        }

        document.getElementById('ans-input').addEventListener('keypress', e => { if(e.key === 'Enter') posaljiOdgovor(); });

        socket.on('obavijest', (d) => {
            const win = document.getElementById('chat-window');
            const div = document.createElement('div');
            let s = "p-3 rounded-xl text-sm mb-2 ";
            if(d.tip === 'tocno') s += "bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
            else if(d.tip === 'netocno') s += "bg-red-500/10 text-red-500 border border-red-500/20";
            else if(d.tip === 'tajmer') s += "text-slate-500 text-center text-[10px] italic";
            else s += "bg-blue-500/10 text-blue-400 border border-blue-500/20";
            div.className = s; div.innerHTML = d.poruka;
            win.appendChild(div); win.scrollTop = win.scrollHeight;
        });

        socket.on('osvjezi_sidebar', (lista) => { /* Ovdje možeš dodati mini listu unutar sobe ako želiš */ });
    </script>
</body>
</html>
