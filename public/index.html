<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Rekvizit Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background: #020617; color: #f8fafc; }</style>
</head>
<body class="flex flex-col h-screen overflow-hidden">
    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950">
        <div class="bg-slate-900 p-8 rounded-2xl border border-slate-800 w-full max-w-sm space-y-3">
            <h1 class="text-2xl font-bold text-center text-blue-500">REKVIZIT ARENA</h1>
            <input type="text" id="username" placeholder="Nadimak" class="w-full p-3 rounded bg-slate-800 outline-none">
            <input type="password" id="password" placeholder="Lozinka" class="w-full p-3 rounded bg-slate-800 outline-none">
            <input type="text" id="secret" placeholder="Tajna šifra" class="w-full p-3 rounded bg-slate-800 outline-none">
            <select id="room-select" class="w-full p-3 rounded bg-slate-800">
                <option value="kultura">🎨 Opća Kultura</option>
                <option value="balkan">🌍 Balkan Express</option>
                <option value="certifikati">🛡️ Cisco Certifikati</option>
            </select>
            <button onclick="prijaviSe()" class="w-full p-3 bg-blue-600 rounded font-bold">UĐI</button>
            <p id="error-msg" class="text-red-500 text-xs hidden"></p>
        </div>
    </div>

    <header class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900">
        <h2 class="font-bold text-blue-400">ARENA KVIZ</h2>
        <div id="display-name" class="text-emerald-400 font-mono text-sm"></div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <main id="chat-window" class="flex-1 overflow-y-auto p-4 space-y-2"></main>
        
        <aside class="w-64 border-l border-slate-800 bg-slate-900/50 p-4 hidden md:block overflow-y-auto">
            <h3 class="text-xs font-bold text-slate-500 uppercase mb-4 tracking-widest">Poredak</h3>
            <div id="leaderboard-list" class="space-y-3"></div>
        </aside>
    </div>

    <footer class="p-4 border-t border-slate-800 flex gap-2">
        <input type="text" id="answer-input" placeholder="Odgovor..." class="flex-1 p-3 rounded bg-slate-900 outline-none">
        <button onclick="posalji()" class="bg-blue-600 px-6 rounded font-bold">ŠALJI</button>
    </footer>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let korisnik = "", soba = "";

        function prijaviSe() {
            korisnik = document.getElementById('username').value.trim();
            const l = document.getElementById('password').value;
            const s = document.getElementById('secret').value;
            soba = document.getElementById('room-select').value;
            if(!korisnik || !l || !s) return alert("Popuni sve!");
            socket.emit('join_room', { soba, ime: korisnik, lozinka: l, tajnaSifra: s });
        }

        socket.on('uspjesna_prijava', (d) => {
            document.getElementById('display-name').innerText = `${d.ime} [${d.bodovi} B]`;
            document.getElementById('login-screen').classList.add('hidden');
        });

        socket.on('osvjezi_tablicu', (lista) => {
            const listDiv = document.getElementById('leaderboard-list');
            listDiv.innerHTML = lista.map((p, i) => `
                <div class="flex justify-between items-center ${p.ime === korisnik ? 'text-blue-400 font-bold' : 'text-slate-300'}">
                    <span>${i+1}. ${p.ime}</span>
                    <span class="font-mono text-xs bg-slate-800 px-2 py-1 rounded">${p.bodovi}</span>
                </div>
            `).join('');
        });

        function posalji() {
            const i = document.getElementById('answer-input');
            socket.emit('slanje_odgovora', { soba, ime: korisnik, tekst: i.value });
            i.value = '';
        }

        socket.on('nova_poruka', (d) => dodajPoruku(`${d.ime} [${d.bodovi} B]`, d.tekst, 'text-slate-400'));
        socket.on('obavijest', (d) => dodajPoruku('SUSTAV', d.poruka, 'text-blue-400 font-bold italic'));

        function dodajPoruku(a, t, s) {
            const w = document.getElementById('chat-window');
            const d = document.createElement('div');
            d.className = `p-1 ${s}`;
            d.innerHTML = `<span class="text-[10px] block opacity-50">${a}</span>${t}`;
            w.appendChild(d); w.scrollTop = w.scrollHeight;
        }
    </script>
</body>
</html>
