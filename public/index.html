<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rekvizit Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #020617; color: #f8fafc; overflow: hidden; height: 100vh; }
        .hidden { display: none; }
        #chat-window { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    </style>
</head>
<body class="flex flex-col">

    <div id="screen-login" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950 p-4">
        <div class="bg-slate-900 p-8 rounded-3xl border border-slate-800 w-full max-w-sm space-y-4 shadow-2xl">
            <h1 class="text-3xl font-black text-blue-500 italic text-center uppercase">Arena</h1>
            <input type="text" id="log-user" placeholder="Nadimak" class="w-full p-4 rounded-xl bg-slate-800 outline-none text-white">
            <input type="password" id="log-pass" placeholder="Lozinka" class="w-full p-4 rounded-xl bg-slate-800 outline-none text-white">
            <div id="wrapper-secret" class="hidden">
                <p class="text-[10px] text-orange-400 mb-1 font-bold italic">PRVA PRIJAVA? SMISLI TAJNU ŠIFRU:</p>
                <input type="text" id="log-secret" placeholder="Tajna šifra" class="w-full p-4 rounded-xl bg-slate-800 border border-orange-500/50 outline-none text-white">
            </div>
            <button id="btn-prijava" onclick="prijava()" class="w-full p-4 bg-blue-600 rounded-2xl font-bold uppercase hover:bg-blue-500">Kreni</button>
        </div>
    </div>

    <div id="screen-menu" class="hidden fixed inset-0 z-40 bg-slate-950 p-4 overflow-y-auto">
        <div class="max-w-6xl mx-auto space-y-6">
            <div class="flex justify-between items-center text-white p-4">
                <h2 class="text-2xl font-black italic">REKVIZIT <span class="text-blue-500">ARENA</span></h2>
                <button onclick="location.reload()" class="text-red-500 text-xs font-bold uppercase">Odjava</button>
            </div>
            
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-1 bg-slate-900 p-6 rounded-3xl border border-slate-800">
                    <h3 class="text-xs font-bold text-slate-500 uppercase mb-4">Rang Lista</h3>
                    <div id="main-leaderboard-body" class="space-y-2 text-white"></div>
                </div>

                <div class="lg:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-3 text-white">
                    <button onclick="ulaziUSobu('drustvo')" class="group p-4 bg-slate-900 rounded-2xl border border-slate-800 hover:border-blue-500 text-left">
                        <div class="flex items-center gap-3">
                            <span class="text-2xl">🏛️</span>
                            <div>
                                <div class="font-bold text-sm uppercase">Društvo</div>
                                <div class="text-[10px] text-slate-500">Kultura • Umjetnost • Religija • Mitologija</div>
                            </div>
                        </div>
                    </button>
                    <button onclick="ulaziUSobu('nauka')" class="group p-4 bg-slate-900 rounded-2xl border border-slate-800 hover:border-emerald-500 text-left">
                        <div class="flex items-center gap-3">
                            <span class="text-2xl">🧪</span>
                            <div>
                                <div class="font-bold text-sm uppercase">Nauka</div>
                                <div class="text-[10px] text-slate-500">Informatika • Biologija • Fizika • Hemija</div>
                            </div>
                        </div>
                    </button>
                    <button onclick="ulaziUSobu('svijet')" class="group p-4 bg-slate-900 rounded-2xl border border-slate-800 hover:border-amber-500 text-left">
                        <div class="flex items-center gap-3">
                            <span class="text-2xl">🌍</span>
                            <div>
                                <div class="font-bold text-sm uppercase">Svijet</div>
                                <div class="text-[10px] text-slate-500">Povijest • Zemljopis • Politika</div>
                            </div>
                        </div>
                    </button>
                    <button onclick="ulaziUSobu('zabava')" class="group p-4 bg-slate-900 rounded-2xl border border-slate-800 hover:border-purple-500 text-left">
                        <div class="flex items-center gap-3">
                            <span class="text-2xl">🎬</span>
                            <div>
                                <div class="font-bold text-sm uppercase">Zabava</div>
                                <div class="text-[10px] text-slate-500">Film • Glazba • Video Igre • Stripovi</div>
                            </div>
                        </div>
                    </button>
                    <button onclick="ulaziUSobu('lifestyle')" class="group p-4 bg-slate-900 rounded-2xl border border-slate-800 hover:border-rose-500 text-left">
                        <div class="flex items-center gap-3">
                            <span class="text-2xl">👗</span>
                            <div>
                                <div class="font-bold text-sm uppercase">Lifestyle</div>
                                <div class="text-[10px] text-slate-500">Moda • Gastronomija • Zanimljivosti</div>
                            </div>
                        </div>
                    </button>
                    <button onclick="ulaziUSobu('sport')" class="group p-4 bg-slate-900 rounded-2xl border border-slate-800 hover:border-emerald-400 text-left">
                        <div class="flex items-center gap-3">
                            <span class="text-2xl">⚽</span>
                            <div>
                                <div class="font-bold text-sm uppercase">Sport</div>
                                <div class="text-[10px] text-slate-500">Nogomet • Košarka • Tenis • Ostalo</div>
                            </div>
                        </div>
                    </button>

                    <div id="admin-section" class="col-span-1 md:col-span-2 hidden space-y-2 mt-2">
                        <button onclick="ulaziUSobu('balkan')" class="w-full p-4 bg-orange-600/10 border border-orange-600/30 text-orange-500 rounded-2xl font-black text-xs uppercase italic">🔥 BALKAN EXPRESS</button>
                        <button onclick="ulaziUSobu('cisco')" class="w-full p-4 bg-blue-600/10 border border-blue-600/30 text-blue-400 rounded-2xl font-black text-xs uppercase italic">🛡️ CISCO ACL STUDY</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="screen-arena" class="hidden h-screen flex flex-col">
        <header class="p-3 bg-slate-900 border-b border-slate-800 flex justify-between items-center text-white">
            <button onclick="povratakUMenu()" class="text-[10px] bg-slate-800 px-3 py-2 rounded-lg uppercase">← Nazad</button>
            <div id="room-title" class="font-bold text-blue-500 uppercase text-xs"></div>
            <div id="user-display" class="text-emerald-400 font-mono text-[10px]"></div>
        </header>
        <main id="chat-window" class="p-4 overflow-y-auto"></main>
        <footer class="p-3 bg-slate-900 border-t border-slate-800">
            <div class="flex gap-2">
                <input type="text" id="ans-input" autocomplete="off" class="flex-1 p-4 rounded-xl bg-slate-800 text-white outline-none">
                <button onclick="posaljiOdgovor()" class="bg-blue-600 px-6 rounded-xl font-bold text-white uppercase text-xs">Šalji</button>
            </div>
        </footer>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io(); let mojId = "";

        function prijava() {
            const user = document.getElementById('log-user').value.trim();
            const pass = document.getElementById('log-pass').value;
            const secret = document.getElementById('log-secret').value;
            socket.emit('prijava', { ime: user, lozinka: pass, tajnaSifra: secret });
        }

        socket.on('prikazi_registraciju', () => { document.getElementById('wrapper-secret').classList.remove('hidden'); });
        
        socket.on('uspjesna_prijava', (d) => {
            mojId = d.ime;
            document.getElementById('screen-login').classList.add('hidden');
            document.getElementById('screen-menu').classList.remove('hidden');
            if(d.jeAdmin) document.getElementById('admin-section').classList.remove('hidden');
            document.getElementById('user-display').innerText = mojId;
            socket.emit('dohvati_glavnu_tablicu', 'all');
        });

        socket.on('odgovor_glavna_tablica', (lista) => {
            document.getElementById('main-leaderboard-body').innerHTML = lista.map((p, i) => `
                <div class="flex justify-between p-2 border-b border-slate-800/50 text-sm">
                    <span>${i+1}. ${p.ime}</span>
                    <span class="text-emerald-400 font-mono">${p.bodovi}</span>
                </div>`).join('');
        });

        function ulaziUSobu(s) {
            document.getElementById('screen-menu').classList.add('hidden');
            document.getElementById('screen-arena').classList.remove('hidden');
            document.getElementById('room-title').innerText = s;
            socket.emit('join_room', s);
            document.getElementById('chat-window').innerHTML = '';
        }

        function povratakUMenu() {
            document.getElementById('screen-arena').classList.add('hidden');
            document.getElementById('screen-menu').classList.remove('hidden');
        }

        function posaljiOdgovor() {
            const i = document.getElementById('ans-input');
            if(i.value.trim()) { socket.emit('slanje_odgovora', { tekst: i.value }); i.value = ''; }
        }

        socket.on('obavijest', (d) => {
            const win = document.getElementById('chat-window');
            const div = document.createElement('div');
            div.className = "p-3 rounded-xl text-sm mb-2 " + (d.tip === 'tocno' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-slate-800 text-white');
            div.innerHTML = d.poruka; win.appendChild(div); win.scrollTop = win.scrollHeight;
        });
    </script>
</body>
</html>
