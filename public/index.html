<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rekvizit Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #020617; color: #f8fafc; overflow: hidden; height: 100vh; }
        .hidden { display: none; }
        #chat-window { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col">

    <div id="screen-login" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950 p-4">
        <div class="bg-slate-900 p-8 rounded-3xl border border-slate-800 w-full max-w-sm space-y-4 shadow-2xl">
            <h1 class="text-3xl font-black text-blue-500 italic text-center uppercase">Arena</h1>
            <input type="text" id="log-user" placeholder="Nadimak" class="w-full p-4 rounded-xl bg-slate-800 outline-none text-white">
            <input type="password" id="log-pass" placeholder="Lozinka" class="w-full p-4 rounded-xl bg-slate-800 outline-none text-white">
            <div id="wrapper-secret" class="hidden">
                <p class="text-[10px] text-orange-400 mb-1 font-bold italic text-center">PRVA PRIJAVA? SMISLI TAJNU ŠIFRU:</p>
                <input type="text" id="log-secret" placeholder="Tajna šifra" class="w-full p-4 rounded-xl bg-slate-800 border border-orange-500/50 outline-none text-white text-center">
            </div>
            <button onclick="prijava()" class="w-full p-4 bg-blue-600 rounded-2xl font-bold uppercase hover:bg-blue-500 transition-colors">Kreni</button>
        </div>
    </div>

    <div id="screen-menu" class="hidden fixed inset-0 z-40 bg-slate-950 p-4 overflow-y-auto">
        <div class="max-w-4xl mx-auto space-y-6">
            <div class="flex justify-between items-center text-white p-4">
                <h2 class="text-2xl font-black italic uppercase">Rekvizit <span class="text-blue-500">Arena</span></h2>
                <button onclick="location.reload()" class="text-red-500 text-xs font-bold uppercase border border-red-500/30 px-3 py-1 rounded-lg">Odjava</button>
            </div>
            
            <div class="grid grid-cols-2 md:grid-cols-3 gap-3 text-white" id="kategorije-lista">
                <button onclick="ulaziUSobu('kultura')" class="p-4 bg-slate-900 rounded-2xl border border-slate-800 hover:border-blue-500 transition-all text-sm font-medium">🎨 Kultura</button>
                <button onclick="ulaziUSobu('sport')" class="p-4 bg-slate-900 rounded-2xl border border-slate-800 hover:border-blue-500 transition-all text-sm font-medium">⚽ Sport</button>
                <button onclick="ulaziUSobu('povijest')" class="p-4 bg-slate-900 rounded-2xl border border-slate-800 hover:border-blue-500 transition-all text-sm font-medium">📜 Povijest</button>
                <button onclick="ulaziUSobu('zemljopis')" class="p-4 bg-slate-900 rounded-2xl border border-slate-800 hover:border-blue-500 transition-all text-sm font-medium">🌍 Zemljopis</button>
                <button onclick="ulaziUSobu('znanost')" class="p-4 bg-slate-900 rounded-2xl border border-slate-800 hover:border-blue-500 transition-all text-sm font-medium">🧪 Znanost</button>
                <button onclick="ulaziUSobu('film')" class="p-4 bg-slate-900 rounded-2xl border border-slate-800 hover:border-blue-500 transition-all text-sm font-medium">🎬 Film</button>
                <button onclick="ulaziUSobu('glazba')" class="p-4 bg-slate-900 rounded-2xl border border-slate-800 hover:border-blue-500 transition-all text-sm font-medium">🎵 Glazba</button>
                
                <div id="admin-section" class="col-span-2 md:col-span-3 hidden space-y-2 mt-4 pt-4 border-t border-slate-800">
                    <p class="text-[10px] text-slate-500 uppercase font-bold tracking-widest text-center">Specijalne kategorije</p>
                    <button onclick="ulaziUSobu('balkan')" class="w-full p-4 bg-orange-600/10 border border-orange-600/30 text-orange-500 rounded-2xl font-bold uppercase italic hover:bg-orange-600/20">🔥 BALKAN EXPRESS</button>
                    <button onclick="ulaziUSobu('cisco')" class="w-full p-4 bg-blue-600/10 border border-blue-600/30 text-blue-400 rounded-2xl font-bold uppercase italic hover:bg-blue-600/20">🛡️ CISCO ACL STUDY</button>
                </div>
            </div>
        </div>
    </div>

    <div id="screen-arena" class="hidden h-screen flex flex-col">
        <header class="p-4 bg-slate-900 border-b border-slate-800 flex justify-between items-center text-white">
            <button onclick="povratakUMenu()" class="text-[10px] bg-slate-800 px-4 py-2 rounded-xl uppercase font-bold">← Nazad</button>
            <div id="room-title" class="font-black text-blue-500 uppercase tracking-widest italic"></div>
            <div id="user-display" class="text-emerald-400 font-mono text-xs font-bold"></div>
        </header>

        <main id="chat-window" class="p-4 space-y-2 flex-1"></main>

        <footer class="p-4 bg-slate-900 border-t border-slate-800">
            <div class="flex gap-2 max-w-4xl mx-auto">
                <input type="text" id="ans-input" autocomplete="off" placeholder="Upiši odgovor..." class="flex-1 p-4 rounded-2xl bg-slate-800 text-white outline-none focus:ring-2 ring-blue-500 transition-all">
                <button onclick="posaljiOdgovor()" class="bg-blue-600 px-8 rounded-2xl font-bold text-white uppercase hover:bg-blue-500">Šalji</button>
            </div>
        </footer>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let mojId = "";

        // PRIJAVA
        function prijava() {
            const user = document.getElementById('log-user').value.trim();
            const pass = document.getElementById('log-pass').value;
            const secret = document.getElementById('log-secret').value;
            if(!user || !pass) return alert("Popuni polja!");
            socket.emit('prijava', { ime: user, lozinka: pass, tajnaSifra: secret });
        }

        socket.on('prikazi_registraciju', () => {
            document.getElementById('wrapper-secret').classList.remove('hidden');
        });
        
        socket.on('uspjesna_prijava', (d) => {
            mojId = d.ime;
            document.getElementById('screen-login').classList.add('hidden');
            document.getElementById('screen-menu').classList.remove('hidden');
            if(d.jeAdmin) document.getElementById('admin-section').classList.remove('hidden');
            document.getElementById('user-display').innerText = mojId;
        });

        // NAVIGACIJA
        function ulaziUSobu(s) {
            document.getElementById('screen-menu').classList.add('hidden');
            document.getElementById('screen-arena').classList.remove('hidden');
            document.getElementById('room-title').innerText = s;
            socket.emit('join_room', s);
            document.getElementById('chat-window').innerHTML = '';
        }

        function povratakUMenu() {
            document.getElementById('screen-arena').classList.add('hidden');
            document.getElementById('screen-menu').classList.remove('hidden');
        }

        // SLANJE ODGOVORA
        function posaljiOdgovor() {
            const i = document.getElementById('ans-input');
            if(i.value.trim()) {
                socket.emit('slanje_odgovora', { tekst: i.value });
                i.value = '';
            }
        }

        // ENTER ZA SLANJE
