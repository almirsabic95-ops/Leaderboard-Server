<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekvizit Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: #020617; color: #f8fafc; overflow: hidden; height: 100vh; }
        .hidden { display: none; }
        #chat-window { flex: 1; overflow-y: auto; }
    </style>
</head>
<body class="flex flex-col">

    <div id="screen-login" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950 p-4">
        <div class="bg-slate-900 p-8 rounded-3xl border border-slate-800 w-full max-w-sm space-y-4 shadow-2xl">
            <h1 class="text-3xl font-black text-blue-500 italic text-center uppercase leading-none">Arena</h1>
            <input type="text" id="log-user" placeholder="Nadimak" class="w-full p-4 rounded-xl bg-slate-800 outline-none text-white border border-transparent focus:border-blue-500">
            <input type="password" id="log-pass" placeholder="Lozinka" class="w-full p-4 rounded-xl bg-slate-800 outline-none text-white border border-transparent focus:border-blue-500">
            
            <div id="wrapper-secret" class="hidden">
                <input type="text" id="log-secret" placeholder="Tajna šifra (samo prvi put)" class="w-full p-4 rounded-xl bg-slate-700 outline-none text-white border border-blue-500">
            </div>

            <button onclick="prijaviSe()" class="w-full p-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl transition-all uppercase tracking-widest shadow-lg shadow-blue-500/20">
                Uđi u Arenu
            </button>
        </div>
    </div>

    <div id="screen-menu" class="hidden p-6 space-y-6 overflow-y-auto h-full">
        <div class="flex justify-between items-center">
            <h2 class="text-2xl font-bold">Dobrodošao, <span id="user-display" class="text-blue-400"></span>!</h2>
        </div>
        
        <div class="grid grid-cols-2 gap-4">
            <button onclick="ulaziUSobu('balkan')" class="p-6 bg-slate-900 border border-slate-800 rounded-2xl text-xl hover:border-blue-500 transition-all">🚩 Balkan</button>
            <button onclick="ulaziUSobu('cisco')" class="p-6 bg-slate-900 border border-slate-800 rounded-2xl text-xl hover:border-blue-500 transition-all">🛡️ Cisco</button>
            <button onclick="ulaziUSobu('sport')" class="p-6 bg-slate-900 border border-slate-800 rounded-2xl text-xl hover:border-blue-500 transition-all">⚽ Sport</button>
            <button onclick="ulaziUSobu('glazba')" class="p-6 bg-slate-900 border border-slate-800 rounded-2xl text-xl hover:border-blue-500 transition-all">🎵 Muzika</button>
        </div>
    </div>

    <div id="screen-arena" class="hidden flex flex-col h-full">
        <div class="p-4 bg-slate-900 flex justify-between items-center border-b border-slate-800">
            <button onclick="povratakUMenu()" class="text-slate-400">← Izlaz</button>
            <h3 id="room-title" class="font-bold uppercase tracking-widest text-blue-500"></h3>
            <div></div>
        </div>
        
        <div id="question-box" class="p-8 text-center text-xl font-medium bg-slate-950/50 italic">
            Čekam pitanje...
        </div>

        <div id="chat-window" class="p-4 space-y-2"></div>

        <div class="p-4 bg-slate-900">
            <div class="flex gap-2">
                <input type="text" id="ans-input" placeholder="Tvoj odgovor..." class="flex-1 p-4 rounded-xl bg-slate-800 outline-none border border-transparent focus:border-blue-500">
                <button onclick="posaljiOdgovor()" class="px-6 bg-blue-600 rounded-xl font-bold">SPOJI</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();

        function prijaviSe() {
            const ime = document.getElementById('log-user').value;
            const lozinka = document.getElementById('log-pass').value;
            const tajnaSifra = document.getElementById('log-secret').value;
            if(!ime || !lozinka) return alert("Upiši podatke!");
            socket.emit('prijava', { ime, lozinka, tajnaSifra });
        }

        socket.on('prikazi_registraciju', () => {
            document.getElementById('wrapper-secret').classList.remove('hidden');
            alert("Korisnik ne postoji. Unesi tajnu šifru za registraciju.");
        });

        socket.on('uspjesna_prijava', (d) => {
            document.getElementById('screen-login').classList.add('hidden');
            document.getElementById('screen-menu').classList.remove('hidden');
            document.getElementById('user-display').innerText = d.ime;
        });

        function ulaziUSobu(s) {
            document.getElementById('screen-menu').classList.add('hidden');
            document.getElementById('screen-arena').classList.remove('hidden');
            document.getElementById('room-title').innerText = s;
            document.getElementById('chat-window').innerHTML = '';
            socket.emit('join_room', s);
        }

        function povratakUMenu() {
            document.getElementById('screen-arena').classList.add('hidden');
            document.getElementById('screen-menu').classList.remove('hidden');
        }

        socket.on('novo_pitanje', (d) => {
            document.getElementById('question-box').innerText = d.pitanje;
        });

        function posaljiOdgovor() {
            const i = document.getElementById('ans-input');
            if(i.value.trim()) {
                socket.emit('slanje_odgovora', { tekst: i.value });
                i.value = '';
            }
        }

        socket.on('obavijest', (d) => {
            const win = document.getElementById('chat-window');
            const div = document.createElement('div');
            div.className = `p-3 rounded-xl text-sm mb-2 ${d.tip === 'tocno' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-slate-800 text-white'}`;
            div.innerText = d.poruka;
            win.appendChild(div);
            win.scrollTop = win.scrollHeight;
        });
    </script>
</body>
</html>
