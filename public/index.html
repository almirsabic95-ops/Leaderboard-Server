<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Rekvizit Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white flex flex-col h-screen overflow-hidden">
    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950">
        <div class="bg-slate-900 p-8 rounded-2xl border border-slate-700 w-96 space-y-4">
            <h1 class="text-2xl font-bold text-center text-blue-400">PRIJAVA</h1>
            <input type="text" id="username" placeholder="Nadimak..." class="w-full p-2 bg-slate-800 rounded outline-none">
            <input type="password" id="password" placeholder="Lozinka..." class="w-full p-2 bg-slate-800 rounded outline-none">
            <input type="text" id="secret" placeholder="Tajna šifra za oporavak..." class="w-full p-2 bg-slate-800 rounded outline-none">
            <select id="room-select" class="w-full p-2 bg-slate-800 rounded">
                <option value="kultura">🎨 Kultura</option>
                <option value="certifikati">🛡️ Moji Certifikati (Blanco)</option>
            </select>
            <button onclick="prijaviSe()" class="w-full p-2 bg-blue-600 rounded font-bold">UĐI</button>
            <p id="error-msg" class="text-red-500 text-xs hidden"></p>
        </div>
    </div>

    <header class="p-4 border-b border-slate-800 flex justify-between items-center">
        <h2 class="text-xl font-bold text-blue-400">Rekvizit Arena</h2>
        <div id="display-name" class="text-emerald-400 font-mono"></div>
    </header>

    <main id="chat-window" class="flex-1 overflow-y-auto p-4 space-y-2"></main>

    <footer class="p-4 bg-slate-900 flex gap-2">
        <input type="text" id="answer-input" class="flex-1 p-2 bg-slate-800 rounded outline-none">
        <button onclick="posalji()" class="bg-blue-600 px-4 rounded font-bold">ŠALJI</button>
    </footer>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let korisnik = "";
        let soba = "";

        function prijaviSe() {
            korisnik = document.getElementById('username').value.trim();
            const lozinka = document.getElementById('password').value;
            const tajnaSifra = document.getElementById('secret').value;
            soba = document.getElementById('room-select').value;
            if(!korisnik || !lozinka || !tajnaSifra) return alert("Popuni sve!");
            socket.emit('join_room', { soba, ime: korisnik, lozinka, tajnaSifra });
        }

        socket.on('uspjesna_prijava', (data) => {
            document.getElementById('display-name').innerText = `${data.ime} (${data.bodovi}b)`;
            document.getElementById('login-screen').classList.add('hidden');
        });

        socket.on('greska_prijava', (msg) => {
            const err = document.getElementById('error-msg');
            err.innerText = msg; err.classList.remove('hidden');
        });

        function posalji() {
            const input = document.getElementById('answer-input');
            socket.emit('slanje_odgovora', { soba, ime: korisnik, tekst: input.value });
            input.value = '';
        }

        socket.on('nova_poruka', (data) => dodajPoruku(data.ime, data.tekst, 'text-slate-400'));
        socket.on('obavijest', (data) => dodajPoruku('SUSTAV', data.poruka, 'text-blue-300 font-bold'));

        function dodajPoruku(autor, tekst, stil) {
            const win = document.getElementById('chat-window');
            const div = document.createElement('div');
            div.className = `p-2 ${stil}`;
            div.innerHTML = `<span class="text-[10px] block opacity-50">${autor}</span>${tekst}`;
            win.appendChild(div);
            win.scrollTop = win.scrollHeight;
        }
    </script>
</body>
</html>
